services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:2.11.4-alpine}
    container_name: ha-caddy
    restart: unless-stopped
    network_mode: host
    environment:
      SERVER_TLS_HOST: ${SERVER_TLS_HOST:-ha-server.local}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/lib/ha/caddy/data:/data
      - /var/lib/ha/caddy/config:/config

  searxng:
    image: searxng/searxng:2026.7.10-4abac08de
    container_name: ha-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro

  music-assistant:
    image: ${MUSIC_ASSISTANT_IMAGE:-ghcr.io/music-assistant/server:2.9.9}
    container_name: ha-music-assistant
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/lib/ha/music-assistant:/data
    environment:
      LOG_LEVEL: ${MUSIC_ASSISTANT_LOG_LEVEL:-info}

  home-assistant:
    profiles: ["home-assistant"]
    image: ${HOME_ASSISTANT_IMAGE:-ghcr.io/home-assistant/home-assistant:stable}
    container_name: ha-home-assistant
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/lib/ha/home-assistant:/config
    environment:
      TZ: ${TZ:-America/Santiago}
